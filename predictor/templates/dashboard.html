<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>InnovScope Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>

        body{
            background: linear-gradient(135deg,#0f172a,#1e293b);
            min-height:100vh;
            font-family:Arial, sans-serif;
        }

        .navbar{
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(10px);
        }

        .dashboard-title{
            color:white;
            text-align:center;
            margin-top:30px;
            margin-bottom:40px;
            font-size:48px;
            font-weight:bold;
        }

        .stat-card{
            border:none;
            border-radius:20px;
            color:white;
            padding:30px;
            text-align:center;
            box-shadow:0 8px 25px rgba(0,0,0,0.3);
        }

        .blue{
            background: linear-gradient(135deg,#3b82f6,#2563eb);
        }

        .green{
            background: linear-gradient(135deg,#10b981,#059669);
        }

        .orange{
            background: linear-gradient(135deg,#f59e0b,#d97706);
        }

        .purple{
            background: linear-gradient(135deg,#8b5cf6,#7c3aed);
        }

        .chart-box{
            background:white;
            border-radius:20px;
            padding:30px;
            margin-top:40px;
            box-shadow:0 8px 20px rgba(0,0,0,0.2);
        }

        .section-title{
            text-align:center;
            margin-bottom:20px;
            font-weight:bold;
        }

    </style>

</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark">

    <div class="container">

        <a class="navbar-brand fw-bold" href="/">
            🚀 InnovScope
        </a>

        <div class="ms-auto">

            <a href="/" class="btn btn-outline-light me-2">
                Home
            </a>

            <a href="/history/" class="btn btn-outline-light">
                History
            </a>

        </div>

    </div>

</nav>

<div class="container">

    <h1 class="dashboard-title">
        📊 InnovScope Analytics Dashboard
    </h1>

    <div class="row g-4">

        <div class="col-md-3">

            <div class="stat-card blue">

                <h5>Total Ideas</h5>

                <h1>{{ total_ideas }}</h1>

            </div>

        </div>

        <div class="col-md-3">

            <div class="stat-card green">

                <h5>Average Score</h5>

                <h1>{{ avg_score }}%</h1>

            </div>

        </div>

        <div class="col-md-3">

            <div class="stat-card orange">

                <h5>Successful Ideas</h5>

                <h1>{{ good_ideas }}</h1>

            </div>

        </div>

        <div class="col-md-3">

            <div class="stat-card purple">

                <h5>Needs Improvement</h5>

                <h1>{{ bad_ideas }}</h1>

            </div>

        </div>

    </div>

    <div class="row mt-4">

        <div class="col-md-6">

            <div class="chart-box">

                <h4 class="section-title">
                    Startup Quality Distribution
                </h4>

                <canvas id="pieChart"></canvas>

            </div>

        </div>

        <div class="col-md-6">

            <div class="chart-box">

                <h4 class="section-title">
                    Dashboard Statistics
                </h4>

                <canvas id="barChart"></canvas>

            </div>

        </div>

    </div>

</div>

<script>

new Chart(document.getElementById('pieChart'), {

    type: 'pie',

    data: {

        labels: ['Good Ideas','Needs Improvement'],

        datasets: [{

            data: [{{ good_ideas }}, {{ bad_ideas }}],

            backgroundColor: [

                '#10b981',
                '#ef4444'

            ]

        }]

    }

});

new Chart(document.getElementById('barChart'), {

    type: 'bar',

    data: {

        labels: [

            'Total Ideas',
            'Successful',
            'Needs Improvement'

        ],

        datasets: [{

            label: 'Statistics',

            data: [

                {{ total_ideas }},
                {{ good_ideas }},
                {{ bad_ideas }}

            ]

        }]

    }

});

</script>

</body>
</html>
