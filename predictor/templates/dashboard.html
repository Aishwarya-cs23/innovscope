<!DOCTYPE html>
<html>

<head>

    <title>Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body class="bg-light">

<div class="container mt-5">

    <h1 class="text-center mb-5">
        📊 InnovScope Dashboard
    </h1>

    <div class="row">

        <div class="col-md-4">

            <div class="card text-center p-4 shadow">

                <h3>Total Ideas</h3>

                <h1>{{ total_ideas }}</h1>

            </div>

        </div>

        <div class="col-md-4">

            <div class="card text-center p-4 shadow">

                <h3>Average Score</h3>

                <h1>{{ avg_score }}%</h1>

            </div>

        </div>

        <div class="col-md-4">

            <div class="card text-center p-4 shadow">

                <h3>Successful Ideas</h3>

                <h1>{{ good_ideas }}</h1>

            </div>

        </div>

    </div>

    <div class="card mt-5 p-4 shadow text-center">

    <div style="width:350px; margin:auto;">

        <canvas id="myChart"></canvas>

    </div>

</div>

</div>

<script>

const ctx = document.getElementById('myChart');

new Chart(ctx, {

    type: 'pie',

    data: {

        labels: ['Good Ideas', 'Needs Improvement'],

        datasets: [{

            data: [{{ good_ideas }}, {{ bad_ideas }}]

        }]

    }

});

</script>

</body>
</html>
