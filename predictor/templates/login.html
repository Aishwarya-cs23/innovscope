{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>InnovScope Login</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{

height:100vh;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;

background:linear-gradient(135deg,#6C63FF,#4D8CF5,#00C9A7);

}

/* Floating circles */

.circle{

position:absolute;
border-radius:50%;
background:rgba(255,255,255,.12);

}

.c1{

width:260px;
height:260px;
top:-60px;
left:-60px;

}

.c2{

width:180px;
height:180px;
bottom:60px;
left:120px;

}

.c3{

width:320px;
height:320px;
right:-120px;
bottom:-120px;

}

.c4{

width:120px;
height:120px;
top:100px;
right:180px;

}

/* Login Card */

.login-card{

width:430px;

background:rgba(255,255,255,.18);

backdrop-filter:blur(20px);

border:1px solid rgba(255,255,255,.25);

border-radius:28px;

padding:45px;

box-shadow:0 20px 60px rgba(0,0,0,.18);

color:white;

position:relative;
z-index:10;

}

.logo{

font-size:42px;

font-weight:700;

text-align:center;

margin-bottom:10px;

}

.subtitle{

text-align:center;

opacity:.9;

margin-bottom:35px;

}

.icon{

width:90px;

height:90px;

margin:auto;

border-radius:50%;

display:flex;

justify-content:center;

align-items:center;

background:rgba(255,255,255,.18);

font-size:42px;

margin-bottom:25px;

}

.form-control{

height:58px;

background:rgba(255,255,255,.12);

border:1px solid rgba(255,255,255,.25);

border-radius:15px;

color:white;

padding-left:18px;

margin-bottom:18px;

}

.form-control::placeholder{

color:#f1f5f9;

}

.form-control:focus{

background:rgba(255,255,255,.18);

color:white;

border-color:white;

box-shadow:none;

}

.btn-login{

width:100%;

height:58px;

border:none;

border-radius:15px;

background:white;

color:#6C63FF;

font-size:18px;

font-weight:700;

margin-top:8px;

transition:.3s;

}

.btn-login:hover{

transform:translateY(-3px);

background:#f8fafc;

}

.register{

margin-top:25px;

text-align:center;

}

.register a{

color:white;

font-weight:bold;

text-decoration:none;

}

.register a:hover{

text-decoration:underline;

}

.alert{

border-radius:12px;

}

@media(max-width:600px){

.login-card{

width:90%;

padding:35px;

}

.logo{

font-size:34px;

}

}

</style>

</head>

<body>

<div class="circle c1"></div>
<div class="circle c2"></div>
<div class="circle c3"></div>
<div class="circle c4"></div>

<div class="login-card">

<div class="icon">

<i class="fas fa-user-lock"></i>

</div>

<div class="logo">

InnovScope

</div>

<div class="subtitle">

Welcome back! Sign in to continue your startup journey.

</div>

{% if error %}

<div class="alert alert-danger">

{{ error }}

</div>

{% endif %}

<form method="POST">

{% csrf_token %}

<input
type="text"
name="username"
class="form-control"
placeholder="Username"
required>

<input
type="password"
name="password"
class="form-control"
placeholder="Password"
required>

<button
type="submit"
class="btn-login">

Sign In

</button>

</form>

<div class="register">

Don't have an account?

<a href="/register/" target="_blank">

Create Account

</a>

</div>

</div>

</body>

</html>
