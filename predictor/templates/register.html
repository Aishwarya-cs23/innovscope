<!DOCTYPE html>
<html>

<head>

    <title>Register</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body{
            background: linear-gradient(to right, #8e2de2, #4a00e0);
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            font-family:Arial;
        }

        .register-box{
            background:white;
            width:450px;
            padding:40px;
            border-radius:20px;
            box-shadow:0px 0px 20px rgba(0,0,0,0.3);
        }

        .title{
            text-align:center;
            margin-bottom:30px;
            font-weight:bold;
            color:#4a00e0;
        }

        .btn-register{
            background:#4a00e0;
            color:white;
        }

        .btn-register:hover{
            background:#3600b3;
            color:white;
        }

    </style>

</head>

<body>

<div class="register-box">

    <h1 class="title">
        🚀 Create Account
    </h1>

    <form method="POST">
        {% if error %}

<div class="alert alert-danger">

    {{ error }}

</div>

{% endif %}

        {% csrf_token %}

        <input
            type="text"
            name="username"
            class="form-control mb-3"
            placeholder="Enter Username"
            required>

        <input
            type="password"
            name="password"
            class="form-control mb-3"
            placeholder="Enter Password"
            required>

        <button class="btn btn-register w-100">

            Register

        </button>

    </form>

    <p class="text-center mt-4">

        Already have an account?

        <a href="/login/">
            Login
        </a>

    </p>

</div>

</body>
</html>
