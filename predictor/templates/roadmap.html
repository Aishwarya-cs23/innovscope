<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Startup Roadmap</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

font-family:'Segoe UI',sans-serif;
background:#eef3fb;
padding:50px 20px;

}

/* Container */

.container{

max-width:1100px;
margin:auto;

}

/* Heading */

.page-title{

text-align:center;
font-size:50px;
font-weight:800;
margin-bottom:45px;

}

.gradient{

background:linear-gradient(135deg,#6C63FF,#00C9A7);

-webkit-background-clip:text;
-webkit-text-fill-color:transparent;

}

/* Timeline */

.timeline{

position:relative;
padding-left:60px;

}

.timeline::before{

content:"";
position:absolute;
left:23px;
top:0;
bottom:0;
width:5px;
border-radius:20px;

background:linear-gradient(
180deg,
#6C63FF,
#00C9A7
);

}

/* Card */

.step{

position:relative;
background:white;
padding:28px;
margin-bottom:35px;
border-radius:24px;

box-shadow:0 15px 35px rgba(0,0,0,.08);

transition:.35s;

}

.step:hover{

transform:translateY(-6px);

box-shadow:0 22px 45px rgba(108,99,255,.18);

}

/* Circle */

.step::before{

content:"";

position:absolute;

left:-48px;

top:35px;

width:22px;

height:22px;

border-radius:50%;

background:linear-gradient(
135deg,
#6C63FF,
#00C9A7
);

border:5px solid #eef3fb;

box-shadow:0 0 0 5px rgba(108,99,255,.15);

}

/* Phase */

.phase{

font-size:28px;

font-weight:700;

margin-bottom:10px;

color:#222;

}

/* Description */

.description{

font-size:18px;

color:#64748b;

line-height:1.7;

}

/* Bottom Button */

.button-box{

text-align:center;

margin-top:50px;

}

.next-btn{

display:inline-block;

padding:16px 45px;

border-radius:15px;

text-decoration:none;

font-size:18px;

font-weight:700;

color:white;

background:linear-gradient(
135deg,
#6C63FF,
#00C9A7
);

transition:.3s;

}

.next-btn:hover{

transform:translateY(-4px);

color:white;

box-shadow:0 15px 30px rgba(108,99,255,.25);

}

@media(max-width:768px){

.timeline{

padding-left:40px;

}

.page-title{

font-size:38px;

}

.phase{

font-size:24px;

}

.description{

font-size:16px;

}

}

</style>

</head>

<body>

<div class="container">

<h1 class="page-title">

<span class="gradient">

Startup Roadmap

</span>

</h1>

<div class="timeline">

{% for step in roadmap_steps %}

<div class="step">

<div class="phase">

Phase {{ forloop.counter }}

</div>

<div class="description">

{{ step }}

</div>

</div>

{% endfor %}

</div>

<div class="button-box">

<a href="{% url 'funding' %}" target="_blank" class="next-btn">

View Funding Plan →

</a>

</div>

</div>

</body>

</html>
